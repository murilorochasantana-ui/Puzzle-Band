<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Puzzle Band</title>
    <script>
      // Tema salvo (src/theme.js) aplicado antes do React, para a pagina nao
      // abrir no tema errado. "sistema" = sem data-theme.
      try {
        var tema = localStorage.getItem('puzzleband:tema');
        if (tema === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        if (tema === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        // localStorage bloqueado: segue o sistema
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
