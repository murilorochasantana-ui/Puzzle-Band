name: puzzleband
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  intl: ^0.20.3
  mqtt_client: ^10.14.0
  shared_preferences: ^2.5.6
  syncfusion_flutter_charts: ^28.2.9
  # Aviso agendado dos lembretes (lib/services/aviso_de_lembrete.dart)
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - assets/fonts/OFL.txt
  # Atkinson Hyperlegible Next (Braille Institute, licenca OFL em assets/fonts/OFL.txt)
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
